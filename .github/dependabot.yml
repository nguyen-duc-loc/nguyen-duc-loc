version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      # Its own group, listed first (a dependency joins the first group it matches). Biome is pinned
      # exactly and a bump can change formatting, so a failing biome ci must not hold back other updates.
      # On a Biome PR, run `pnpm exec biome migrate --write` so the $schema version in biome.json matches.
      biome:
        patterns: ["@biomejs/biome"]
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
    ignore:
      # Keep the Node types on Node 26, the runtime this repo targets.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
