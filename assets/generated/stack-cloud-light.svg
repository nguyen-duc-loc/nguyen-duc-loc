<style>.fill-surface{fill:#eff1f5}.stroke-surface{stroke:#eff1f5}.stop-surface{stop-color:#eff1f5}.fill-border{fill:#ccd0da}.stroke-border{stroke:#ccd0da}.stop-border{stop-color:#ccd0da}.fill-track{fill:#dce0e8}.stroke-track{stroke:#dce0e8}.stop-track{stop-color:#dce0e8}.fill-text{fill:#4c4f69}.stroke-text{stroke:#4c4f69}.stop-text{stop-color:#4c4f69}.fill-muted{fill:#5c5f77}.stroke-muted{stroke:#5c5f77}.stop-muted{stop-color:#5c5f77}.fill-accent{fill:#8839ef}.stroke-accent{stroke:#8839ef}.stop-accent{stop-color:#8839ef}.fill-accent2{fill:#1e66f5}.stroke-accent2{stroke:#1e66f5}.stop-accent2{stop-color:#1e66f5}.fill-onAccent{fill:#ffffff}.stroke-onAccent{stroke:#ffffff}.stop-onAccent{stop-color:#ffffff}.fill-success{fill:#40a02b}.stroke-success{stroke:#40a02b}.stop-success{stop-color:#40a02b}.fill-warning{fill:#df8e1d}.stroke-warning{stroke:#df8e1d}.stop-warning{stop-color:#df8e1d}.fill-danger{fill:#d20f39}.stroke-danger{stroke:#d20f39}.stop-danger{stop-color:#d20f39}svg{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"}.font-mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.enter{animation:enter 600ms cubic-bezier(0.2, 0, 0, 1) both}@keyframes enter{from{opacity:0;transform:translateY(8px)}}.grow{animation:grow 1000ms cubic-bezier(0.2, 0, 0, 1) both;transform-box:fill-box;transform-origin:left center}@keyframes grow{from{transform:scaleX(0)}}.gauge{animation:gauge 1000ms cubic-bezier(0.2, 0, 0, 1) both}@keyframes gauge{from{stroke-dashoffset:var(--gauge-empty)}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
