<style>.fill-surface{fill:#1e1e2e}.stroke-surface{stroke:#1e1e2e}.stop-surface{stop-color:#1e1e2e}.fill-border{fill:#313244}.stroke-border{stroke:#313244}.stop-border{stop-color:#313244}.fill-track{fill:#45475a}.stroke-track{stroke:#45475a}.stop-track{stop-color:#45475a}.fill-text{fill:#cdd6f4}.stroke-text{stroke:#cdd6f4}.stop-text{stop-color:#cdd6f4}.fill-muted{fill:#a6adc8}.stroke-muted{stroke:#a6adc8}.stop-muted{stop-color:#a6adc8}.fill-accent{fill:#cba6f7}.stroke-accent{stroke:#cba6f7}.stop-accent{stop-color:#cba6f7}.fill-accent2{fill:#89b4fa}.stroke-accent2{stroke:#89b4fa}.stop-accent2{stop-color:#89b4fa}.fill-onAccent{fill:#11111b}.stroke-onAccent{stroke:#11111b}.stop-onAccent{stop-color:#11111b}.fill-success{fill:#a6e3a1}.stroke-success{stroke:#a6e3a1}.stop-success{stop-color:#a6e3a1}.fill-warning{fill:#f9e2af}.stroke-warning{stroke:#f9e2af}.stop-warning{stop-color:#f9e2af}.fill-danger{fill:#f38ba8}.stroke-danger{stroke:#f38ba8}.stop-danger{stop-color:#f38ba8}svg{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"}.font-mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.enter{animation:enter 600ms cubic-bezier(0.2, 0, 0, 1) both}@keyframes enter{from{opacity:0;transform:translateY(8px)}}.grow{animation:grow 1000ms cubic-bezier(0.2, 0, 0, 1) both;transform-box:fill-box;transform-origin:left center}@keyframes grow{from{transform:scaleX(0)}}.gauge{animation:gauge 1000ms cubic-bezier(0.2, 0, 0, 1) both}@keyframes gauge{from{stroke-dashoffset:var(--gauge-empty)}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
